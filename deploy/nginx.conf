# Yakit - nginx reverse proxy sablonu (yeni VPS icin)
#
# Bu dosya Node uygulamasinin (varsayilan port 4000, bkz. server/.env PORT) onune
# konan ters vekili tanimlar: HTTPS sonlandirma (certbot), WebSocket upgrade
# (/ws - operator/kiosk canli guncellemeleri, interkom sinyallesmesi), guvenlik
# basliklari ve gzip. Uygulamanin kendi guvenlik katmani (helmet/CORS/rate-limit,
# bkz. server/src/app.ts) burada TEKRARLANMIYOR - nginx yalnizca TLS ve trafik
# yonlendirmesinden sorumlu.
#
# Kurulum:
#   1. Bu dosyayi /etc/nginx/sites-available/yakit olarak kopyalayin.
#   2. DOMAIN_ADI yerlerini gercek alan adinizla degistirin.
#   3. sudo ln -s /etc/nginx/sites-available/yakit /etc/nginx/sites-enabled/
#   4. sudo certbot --nginx -d DOMAIN_ADI   (Let's Encrypt sertifikasi + otomatik HTTPS yonlendirmesi ekler)
#   5. sudo nginx -t && sudo systemctl reload nginx

upstream yakit_app {
    # Node uygulamasi ayni makinede (127.0.0.1) systemd servisi olarak calisir -
    # bkz. deploy/yakit.service. Disaridan DOGRUDAN erisilemez (bkz. setup-firewall.sh).
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ADI;

    # certbot --nginx calistirildiginda bu blok otomatik olarak 443'e yonlendiren
    # bir bloga donusturulur; elle HTTPS yonlendirmesi eklemeye gerek yok.
    location / {
        proxy_pass http://yakit_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Uygulama "trust proxy" ayarini kullaniyor (bkz. app.ts) - bu basliklar
        # olmadan rate-limit ve denetim kaydindaki IP bilgisi yanlis olur.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

